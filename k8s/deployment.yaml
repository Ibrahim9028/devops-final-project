

apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-final-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-final-app

  template:
    metadata:
      labels:
        app: devops-final-app

    spec:
      containers:
        - name: devops-final-container
          image: devops-final-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
